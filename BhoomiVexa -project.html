<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BhoomiVexa</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f7ef;--card:#fff;--tx:#1f2a1c;--mut:#5f6d59;--g:#2f7d32;--g2:#e3f1de;--bd:#dbe4d3;--warn:#b45309;--wb:#fdf0d8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b12;--card:#1e281b;--tx:#e8f0e3;--mut:#a3b19d;--g:#6fbf73;--g2:#26361f;--bd:#33432d;--warn:#f0b35a;--wb:#3a2e15}}
:root[data-theme="dark"]{--bg:#141b12;--card:#1e281b;--tx:#e8f0e3;--mut:#a3b19d;--g:#6fbf73;--g2:#26361f;--bd:#33432d;--warn:#f0b35a;--wb:#3a2e15}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,Segoe UI,Roboto,"Noto Sans Tamil","Noto Sans Devanagari","Noto Sans Telugu",sans-serif}
header{background:var(--g);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{font-size:18px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:calc(env(safe-area-inset-top,0px) + 50px);z-index:4}
nav button{white-space:nowrap;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:10px 14px;border-radius:999px;font-size:15px;cursor:pointer}
nav button.on{background:var(--g);color:#fff;border-color:var(--g)}
main{max-width:980px;margin:0 auto;padding:14px}
h2{margin:6px 0 12px;font-size:22px}h3{margin:0 0 8px;font-size:17px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
.big{font-size:28px;font-weight:700;color:var(--g)}.mut{color:var(--mut);font-size:14px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--wb);color:var(--warn);font-weight:600}
.tag.ok{background:var(--g2);color:var(--g)}
.warn{background:var(--wb);color:var(--warn);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
button.p{background:var(--g);color:#fff;border:0;border-radius:12px;padding:13px 18px;font-size:16px;cursor:pointer;min-height:48px}
button.s{background:var(--g2);color:var(--g);border:0;border-radius:12px;padding:11px 14px;font-size:15px;cursor:pointer}
label{display:block;font-size:14px;color:var(--mut);margin:8px 0 2px}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;font-size:16px;background:var(--bg);color:var(--tx)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
.bar{height:12px;background:var(--g2);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.ar{position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:linear-gradient(#bfe0f5 0 30%,#7fae4f 30% 100%)}
.ar video,.ar svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mk{cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;display:none;z-index:9}
</style></head><body>
<header><b>🌾 BhoomiVexa</b><div class="row" style="flex:0"><button class="s" id="vo" title="Voice guidance">🔊</button><select id="lg" style="width:auto"><option value="en">English</option><option value="ta">தமிழ்</option><option value="hi">हिन्दी</option><option value="te">తెలుగు</option></select></div></header>
<nav id="nav"></nav><main id="m"></main><div id="toast"></div>
<script>
const T={en:{dash:"Dashboard",fields:"My Fields",reco:"Crop Recommendations",dis:"Disease Detection",soil:"Soil Intelligence",wx:"Weather",ar:"AR Field Guide",regen:"Regenerative",share:"Data Sharing",set:"Settings",ask:"Ask AI",hi:"Welcome, farmer"},
ta:{dash:"முகப்பு",fields:"என் வயல்கள்",reco:"பயிர் பரிந்துரை",dis:"நோய் கண்டறிதல்",soil:"மண் நுண்ணறிவு",wx:"வானிலை",ar:"AR வயல் வழிகாட்டி",regen:"மீளுருவாக்க வேளாண்மை",share:"தரவு பகிர்வு",set:"அமைப்புகள்",ask:"AI-யிடம் கேளுங்கள்",hi:"வணக்கம், விவசாயியே"},
hi:{dash:"मुख्य पृष्ठ",fields:"मेरे खेत",reco:"फसल सुझाव",dis:"रोग पहचान",soil:"मिट्टी की जानकारी",wx:"मौसम",ar:"AR खेत गाइड",regen:"पुनर्योजी खेती",share:"डेटा साझा",set:"सेटिंग्स",ask:"AI से पूछें",hi:"नमस्ते, किसान भाई"},
te:{dash:"హోమ్",fields:"నా పొలాలు",reco:"పంట సిఫార్సులు",dis:"వ్యాధి గుర్తింపు",soil:"నేల సమాచారం",wx:"వాతావరణం",ar:"AR పొలం గైడ్",regen:"పునరుత్పాదక వ్యవసాయం",share:"డేటా షేరింగ్",set:"సెట్టింగ్‌లు",ask:"AIని అడగండి",hi:"నమస్కారం, రైతు గారు"}};
const SAMPLE=[{name:"Kaveri Delta Plot",loc:"Thanjavur, Tamil Nadu",lat:10.79,lon:79.14,area:2.5,crop:"Rice (Samba)",soilType:"Clay loam",ph:6.8,n:240,p:18,k:190,moist:34,src:"sample"},
{name:"Punjab Wheat Plot",loc:"Ludhiana, Punjab",lat:30.9,lon:75.86,area:4,crop:"Wheat",soilType:"Alluvial",ph:7.6,n:260,p:22,k:210,moist:26,src:"sample"},
{name:"Vidarbha Cotton Plot",loc:"Yavatmal, Maharashtra",lat:20.39,lon:78.12,area:3,crop:"Cotton",soilType:"Black cotton",ph:7.9,n:150,p:10,k:280,moist:22,src:"sample"},
{name:"Guntur Chilli Plot",loc:"Guntur, Andhra Pradesh",lat:16.31,lon:80.44,area:1.5,crop:"Chilli",soilType:"Black cotton",ph:7.2,n:170,p:14,k:190,moist:28,src:"sample"},
{name:"Marwar Bajra Plot",loc:"Jodhpur, Rajasthan",lat:26.24,lon:73.02,area:5,crop:"Bajra",soilType:"Red sandy",ph:8.1,n:90,p:9,k:140,moist:12,src:"sample"}];
let S={lang:"en",mode:"sample",user:[],sel:0,route:"dash"};
try{Object.assign(S,JSON.parse(localStorage.getItem("ks")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("ks",JSON.stringify(S))}catch(e){}};
const t=k=>T[S.lang][k]||k, F=()=>S.mode=="sample"?SAMPLE:S.user, cur=()=>F()[S.sel]||F()[0];
const toast=m=>{const e=document.getElementById("toast");e.textContent=m;e.style.display="block";setTimeout(()=>e.style.display="none",2200)};
const SIM='<span class="tag">SIMULATED / SAMPLE DATA</span>';
const routes=["dash","fields","reco","dis","ask","soil","wx","ar","regen","share","set"];
const speak=x=>{if("speechSynthesis" in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(x);u.lang={en:"en-IN",ta:"ta-IN",hi:"hi-IN",te:"te-IN"}[S.lang];speechSynthesis.speak(u)}else toast("Voice demo: audio service not connected")};
document.getElementById("vo").onclick=()=>speak(document.getElementById("m").innerText.slice(0,500));
document.getElementById("lg").onchange=e=>{S.lang=e.target.value;save();go(S.route)};
function go(r){S.route=r;save();const k=S.mode+S.sel;if(k!=WK){WK=k;loadWx()}document.getElementById("lg").value=S.lang;
 document.getElementById("nav").innerHTML=routes.map(x=>`<button class="${x==r?"on":""}" onclick="go('${x}')">${t(x)}</button>`).join("");
 const m=document.getElementById("m");m.innerHTML=`<h2>${t(r)}</h2>`+V[r]();if(A[r])A[r]();scrollTo(0,0)}
const emptyMsg='<div class="card">No fields yet. Add one in My Fields, or switch to sample data in Settings.</div>';
const WX0=[["Mon",32,0],["Tue",33,2],["Wed",30,14],["Thu",29,22],["Fri",31,6],["Sat",33,0],["Sun",34,0]];let WX=WX0,W={t:32,h:74,live:false},WK;const hv=()=>WX.find(x=>x[2]>=10);
const V={
dash(){const f=cur();if(!f)return emptyMsg;const health=f.moist<20?"Needs water":"Good";
 return `<p>${t("hi")} 👋 · ${f.name} (${f.loc}) ${f.src=="sample"?SIM:'<span class="tag ok">Your data</span>'}</p>
 <div class="grid"><div class="card"><h3>☀️ Weather</h3><div class="big">${W.t}°C</div><div class="mut">Humidity ${W.h}% · ${W.live?"live":"sample"}</div></div>
 <div class="card"><h3>💧 Soil moisture</h3><div class="big">${f.moist}%</div><div class="bar"><i style="width:${f.moist}%"></i></div></div>
 <div class="card"><h3>🌱 Crop health</h3><div class="big">${health}</div><div class="mut">${f.crop} · ${f.area} acre</div></div></div>
 <h3 style="margin-top:14px">Alerts</h3>${hv()?`<div class="warn">⚠️ Heavy rain likely ${hv()[0]} (${hv()[2]} mm). Delay fertilizer and check drainage channels.</div>`:'<div class="card">✅ No heavy rain expected in the next 7 days.</div>'}
 <h3>Recommended actions</h3><div class="card"><ol><li>${hv()?`Skip irrigation until ${hv()[0]}'s rain passes.`:"Irrigate if the soil is dry."}</li><li>Scout leaves for spots after the rain.</li><li>Add compost before next sowing.</li></ol></div>
 <div class="row" style="margin-top:12px"><button class="p" onclick="go('reco')">🌾 Crop advice</button><button class="p" onclick="go('dis')">🍃 Check a leaf</button></div>`},
fields(){const l=F();return `<div class="grid">${l.map((f,i)=>`<div class="card"><h3>${f.name}</h3><div class="mut">${f.loc} · ${f.area} acre · ${f.crop} · ${f.soilType}</div><div class="row" style="margin-top:8px"><button class="s" onclick="S.sel=${i};go('soil')">Details</button>${f.src!="sample"?`<button class="s" onclick="delF(${i})">Delete</button>`:""}</div></div>`).join("")||emptyMsg}</div>
 <div class="card" style="margin-top:12px"><h3>Illustrative field map ${SIM}</h3><svg viewBox="0 0 300 150" width="100%"><rect width="300" height="150" fill="#cfe6b8"/><path d="M0 110 Q80 90 150 105 T300 95 V150 H0Z" fill="#9ec5e3"/><polygon points="70,30 200,22 230,80 90,92" fill="#7fae4f" stroke="#2f7d32" stroke-width="3"/><text x="100" y="62" font-size="12" fill="#1f2a1c">${cur()?cur().name:"Field"}</text></svg></div>
 <form class="card" id="ff" style="margin-top:12px"><h3>Add a field</h3><label>Name</label><input name="name" required><label>Location</label><input name="loc" required><div class="row"><div><label>Area (acre)</label><input name="area" type="number" step="0.1" required></div><div><label>Crop</label><input name="crop" required></div></div><label>Soil type</label><select name="soilType"><option>Clay loam</option><option>Red sandy</option><option>Black cotton</option><option>Alluvial</option></select><div class="row"><div><label>pH (optional)</label><input name="ph" type="number" step="0.1"></div><div><label>N kg/ha</label><input name="n" type="number"></div><div><label>P</label><input name="p" type="number"></div><div><label>K</label><input name="k" type="number"></div></div><button class="p" style="margin-top:12px">Save field</button></form>`},
reco(){const f=cur()||{};return `<div class="warn">Transparent demo rules engine (no AI backend connected). Not agronomic advice.</div>
 <form class="card" id="rf"><div class="row"><div><label>Soil pH</label><input name="ph" type="number" step="0.1" value="${f.ph||6.5}"></div><div><label>Nitrogen kg/ha</label><input name="n" type="number" value="${f.n||200}"></div></div><div class="row"><div><label>Phosphorus</label><input name="p" type="number" value="${f.p||15}"></div><div><label>Potassium</label><input name="k" type="number" value="${f.k||150}"></div></div><div class="row"><div><label>Moisture %</label><input name="m" type="number" value="${f.moist||30}"></div><div><label>Season</label><select name="s"><option>Kharif</option><option>Rabi</option><option>Summer</option></select></div></div><label>Location</label><input name="l" value="${f.loc||"Tamil Nadu"}"><button class="p" style="margin-top:12px">Get recommendations</button></form><div id="rr"></div>`},
dis(){return `<div class="warn">${S.key?"<b>Powered by Google Gemini.</b> AI suggestion, not a diagnosis. Confirm with your local agriculture officer or KVK.":"<b>Prototype only.</b> Add a Gemini API key in Settings for real analysis. Results below are simulated and are NOT a diagnosis."}</div>
 <div class="card"><input type="file" id="fi" accept="image/*" capture="environment"><div id="dr" class="mut" style="margin-top:10px">Choose or capture a leaf photo.</div></div>`},
soil(){const f=cur();if(!f)return emptyMsg;const b=(l,v,max,note)=>`<div class="card"><h3>${l}: ${v}</h3><div class="bar"><i style="width:${Math.min(100,v/max*100)}%"></i></div><p class="mut">${note}</p></div>`;
 return `<p>${f.name} ${f.src=="sample"?SIM+" · values are sample values":'<span class="tag ok">Manually entered</span>'}</p><div class="grid">
 ${b("pH",f.ph,14,f.ph>=6&&f.ph<=7.5?"Near-neutral: suits most crops.":"Outside ideal 6–7.5; consider lime or gypsum.")}
 ${b("Nitrogen",f.n,400,f.n<180?"Low: add compost or grow a legume.":"Adequate for cereals.")}
 ${b("Phosphorus",f.p,40,f.p<12?"Low: consider rock phosphate.":"Moderate.")}
 ${b("Potassium",f.k,300,f.k<120?"Low: add ash or compost.":"Adequate.")}
 ${b("Moisture %",f.moist,60,"Higher moisture suits rice; millets prefer drier soil.")}</div>`},
wx(){const mx=Math.max(...WX.map(x=>x[2]),1);return `<p>${W.live?'<span class="tag ok">LIVE · Open-Meteo</span>':SIM+" Live weather unavailable."}</p><div class="grid"><div class="card"><h3>Now</h3><div class="big">${W.t}°C</div><div class="mut">Humidity ${W.h}%</div></div><div class="card"><h3>Irrigation guidance</h3><p>${hv()?`${hv()[2]} mm rain expected ${hv()[0]}, so hold irrigation.`:"No heavy rain soon; irrigate if the soil is dry."} Based on: ${W.live?"live":"sample"} forecast + soil moisture ${cur()?cur().moist:"-"}%.</p></div></div>
 <div class="card" style="margin-top:12px"><h3>7-day rainfall (mm)</h3><svg viewBox="0 0 280 110" width="100%">${WX.map((x,i)=>`<rect x="${i*40+8}" y="${85-x[2]/mx*70}" width="26" height="${x[2]/mx*70+1}" fill="#2f7d32"/><text x="${i*40+8}" y="102" font-size="11" fill="currentColor">${x[0]}</text><text x="${i*40+8}" y="${80-x[2]/mx*70}" font-size="10" fill="currentColor">${x[2]}</text>`).join("")}</svg><table><tr><th>Day</th><th>Temp °C</th></tr>${WX.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join("")}</table></div>${hv()?`<div class="warn">⚠️ Heavy rain ${hv()[0]}: check drainage.</div>`:""}`},
ar(){return `<div class="warn">Simulation: overlays are NOT anchored to your real field. Camera (if allowed) shows a live view only.</div><div class="ar" id="arb"><svg id="ars" viewBox="0 0 400 300"></svg></div>
 <div class="row" style="margin-top:10px"><button class="p" id="cam">📷 Start camera</button><label style="margin:0;flex:1"><input type="checkbox" class="ly" value="sp" checked> Spacing</label><label style="margin:0"><input type="checkbox" class="ly" value="ir" checked> Irrigation</label><label style="margin:0"><input type="checkbox" class="ly" value="hl" checked> Health</label></div><div class="card" id="ai" style="margin-top:10px">Tap a marker for guidance.</div>`},
regen(){const c=cur()?cur().crop:"your crop";const it=[["🔄 Crop rotation",`After ${c}, plant a pulse (black gram or green gram) to fix nitrogen.`],["🌿 Cover crops","Grow sunhemp or cowpea in fallow months, then incorporate."],["🧪 Organic soil improvement","Apply 2–3 t/acre compost or farmyard manure; consider azolla for paddy."],["💧 Water conservation","Use mulching, bunds and alternate wetting and drying for rice."],["🐛 Integrated pest management","Use pheromone traps, neem spray and scouting before any chemicals."]];
 return `<div class="grid">${it.map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join("")}</div>`},
share(){return `<div class="warn">Concept only. No real government-system integration exists.</div><div class="card"><h3>Sample sharing status ${SIM}</h3><table><tr><th>System</th><th>Data</th><th>Status</th></tr><tr><td>State A agri portal</td><td>Anonymized soil summary</td><td>Placeholder</td></tr><tr><td>State B agri portal</td><td>Pest alert</td><td>Placeholder</td></tr></table></div>
 <div class="card" style="margin-top:12px"><h3>API placeholder</h3><input id="ep" placeholder="https://api.example.gov/v1/insights"><label>Preview payload (anonymized)</label><pre class="mut" style="white-space:pre-wrap">{"region":"Thanjavur","crop":"Rice","ph_band":"6.5-7","consent":true}</pre><button class="p" onclick="toast('Demo: nothing was sent')">Send test (demo)</button></div>`},
set(){return `<div class="card" style="margin-bottom:12px"><h3>Google AI (Gemini)</h3><p class="mut">Free key from Google AI Studio. Stored only in this browser. Demo use only: for production, call Gemini through your own backend.</p><input id="gk" type="password" placeholder="Gemini API key" value="${S.key||""}"><button class="p" style="margin-top:10px" onclick="S.key=document.getElementById('gk').value.trim();save();toast('Key saved')">Save key</button></div><div class="card"><h3>Data source</h3><div class="row"><button class="${S.mode=="sample"?"p":"s"}" onclick="S.mode='sample';S.sel=0;go('set')">Sample data</button><button class="${S.mode=="user"?"p":"s"}" onclick="S.mode='user';S.sel=0;go('set')">My data (${S.user.length})</button></div>
 <h3 style="margin-top:14px">Theme</h3><div class="row"><button class="s" onclick="document.documentElement.dataset.theme='light'">Light</button><button class="s" onclick="document.documentElement.dataset.theme='dark'">Dark</button></div>
 <button class="s" style="margin-top:14px" onclick="if(confirm('Erase saved fields?')){S.user=[];save();go('set');toast('Cleared')}">Clear my data</button></div>`}};
const CROPS=[["Rice",[5.5,7],[30,60],240,"Kharif"],["Groundnut",[6,7.5],[15,35],120,"Rabi"],["Finger millet (Ragi)",[5,7.5],[10,30],100,"Kharif"],["Maize",[5.8,7.5],[20,40],220,"Rabi"],["Black gram",[6,7.5],[15,35],90,"Summer"],["Cotton",[6,8],[15,35],200,"Kharif"],["Wheat",[6,7.8],[15,35],200,"Rabi"],["Bajra (Pearl millet)",[6.2,8],[8,25],80,"Kharif"]];
function delF(i){S.user.splice(i,1);save();go("fields")}
const A={
fields(){document.getElementById("ff").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));["ph","n","p","k","area"].forEach(k=>d[k]=d[k]===""?null:+d[k]);d.moist=30;d.ph=d.ph??6.5;d.n=d.n??200;d.p=d.p??15;d.k=d.k??150;d.src="user";try{const g=await(await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&name="+encodeURIComponent(d.loc.split(",")[0]))).json();if(g.results){d.lat=g.results[0].latitude;d.lon=g.results[0].longitude}}catch(_){}S.user.push(d);S.mode="user";S.sel=S.user.length-1;save();toast("Field saved ✓");go("fields")}},
reco(){document.getElementById("rf").onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const ph=+d.ph,n=+d.n,m=+d.m;
 const r=CROPS.map(c=>{let s=0,w=[];if(ph>=c[1][0]&&ph<=c[1][1]){s+=35;w.push("pH "+ph+" is in its range")}else w.push("pH is outside its range");
 if(m>=c[2][0]&&m<=c[2][1]){s+=30;w.push("moisture suits it")}else w.push("moisture is off");
 if(n>=c[3]*0.8){s+=15;w.push("nitrogen adequate")}else w.push("nitrogen low");
 if(c[4]==d.s){s+=20;w.push(d.s+" is a suitable season")}return{n:c[0],s,w}}).sort((a,b)=>b.s-a.s).slice(0,3);
 document.getElementById("rr").innerHTML=`<div class="grid" style="margin-top:12px">${r.map(x=>`<div class="card"><h3>${x.n} <span class="tag ok">Fit ${x.s}/100</span></h3><ul class="mut">${x.w.map(w=>"<li>"+w+"</li>").join("")}</ul></div>`).join("")}</div><div class="card" style="margin-top:12px"><h3>Regenerative practices</h3>Rotate with a pulse, sow cover crops in fallow, add compost, and reduce tillage.</div><button class="p" id="rg" style="margin-top:12px">✨ Explain with Gemini</button><div class="card" id="rx" style="margin-top:12px;display:none"></div>`;document.getElementById("rg").onclick=()=>aiTo("rx",`${ctx()} Current inputs: pH ${d.ph}, N ${d.n}, P ${d.p}, K ${d.k}, moisture ${d.m}%, season ${d.s}. Rule-engine top crops: ${r.map(x=>x.n+" (fit "+x.s+")").join(", ")}. Give a short plan for the best crop: sowing, irrigation, fertilizer, plus one regenerative tip.`);toast("Recommendations ready")}},
dis(){document.getElementById("fi").onchange=e=>{const f=e.target.files[0],o=document.getElementById("dr");if(!f)return;if(!f.type.startsWith("image/")){o.innerHTML='<div class="warn">Please choose an image file.</div>';return}
 if(S.key){o.textContent="Analyzing with Gemini…";const rd=new FileReader();rd.onload=async()=>{try{const j=JSON.parse(await gem([{text:SYS()+' Analyse this crop leaf photo. Return JSON with string fields: crop, issue, symptoms, prevention, next_steps. If it is not a plant photo, set issue to "Not a plant photo". Do not claim certainty.'},{inline_data:{mime_type:f.type,data:rd.result.split(",")[1]}}],1));o.innerHTML=`<img src="${URL.createObjectURL(f)}" style="max-width:100%;max-height:220px;border-radius:12px"><p><span class="tag ok">Google Gemini</span></p><h3>${esc(j.crop)}: ${esc(j.issue)}</h3><p class="mut"><b>Symptoms:</b> ${esc(j.symptoms)}<br><b>Prevention:</b> ${esc(j.prevention)}<br><b>Next steps:</b> ${esc(j.next_steps)}</p><button class="s" onclick="speak(this.previousSibling.textContent)">🔊</button>`}catch(x){o.innerHTML='<div class="warn">Gemini error: '+esc(x.message)+'</div>'}};rd.readAsDataURL(f);return}
 o.innerHTML="Analyzing (simulated)…";setTimeout(()=>{o.innerHTML=`<img src="${URL.createObjectURL(f)}" style="max-width:100%;max-height:220px;border-radius:12px"><p>${SIM}</p><h3>Suspected: Brown spot (example only)</h3><p class="mut"><b>Symptoms:</b> oval brown spots with yellow halo.<br><b>Prevention:</b> balanced fertilizer, clean seed, avoid water stress.<br><b>Next steps:</b> photograph several leaves and show them to your local agriculture officer or KVK.</p>`},900)}},

 document.getElementById("cam").onclick=async()=>{try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});const v=document.createElement("video");v.srcObject=s;v.autoplay=true;v.playsInline=true;v.muted=true;document.getElementById("arb").prepend(v);toast("Camera on (overlays are not anchored)")}catch(e){toast("Camera unavailable: using simulation")}}}};

async function gem(parts,json){if(!S.key)throw new Error("Add a Gemini API key in Settings");const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+(S.model||"gemini-2.5-flash")+":generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":S.key},body:JSON.stringify({contents:[{parts}],generationConfig:json?{responseMimeType:"application/json"}:{}})});const d=await r.json();if(!r.ok)throw new Error(d.error?.message||r.status);return d.candidates[0].content.parts.map(p=>p.text||"").join("")}
const SYS=()=>`You are an agronomy assistant for Indian smallholder farmers. Reply in ${LN[S.lang]} in simple words and short sentences, plain text without markdown. Be practical, avoid chemical dosages, and advise confirming with the local KVK or agriculture officer.`;
const ctx=()=>{const f=cur()||{};return `Farm: ${f.name}, ${f.loc}, ${f.area} acre, crop ${f.crop}, soil ${f.soilType}, pH ${f.ph}, N ${f.n}, P ${f.p}, K ${f.k} kg/ha, moisture ${f.moist}%. 7-day forecast [day,maxC,rain mm]: ${JSON.stringify(WX)}.`};

async function loadWx(){W={t:32,h:74,live:false};WX=WX0;const f=cur();if(!f||!f.lat)return;try{const r=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${f.lat}&longitude=${f.lon}&current=temperature_2m,relative_humidity_2m&daily=temperature_2m_max,precipitation_sum&timezone=auto`)).json(),d=r.daily;WX=d.time.map((x,i)=>[new Date(x).toLocaleDateString("en-IN",{weekday:"short",timeZone:"UTC"}),Math.round(d.temperature_2m_max[i]),Math.round(d.precipitation_sum[i])]);W={t:Math.round(r.current.temperature_2m),h:r.current.relative_humidity_2m,live:true};if(S.route=="dash"||S.route=="wx")go(S.route)}catch(e){}}
